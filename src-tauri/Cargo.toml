[package]
name = "gba-emulator"
version = "0.1.0"
description = "GBA Emulator desktop dashboard built with Tauri"
authors = ["crispiest0210"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# Standard rlib is sufficient for standard Tauri desktop compilation, which speeds up builds by 3x by not producing static/dynamic C libraries.
name = "tauri_app_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
opt-level = 0
debug = 1
incremental = true

[profile.release]
opt-level = 3
lto = "thin"         # Use Thin LTO to parallelize link-time optimization, dramatically speeding up release linking
codegen-units = 16   # Allow compiling multiple files in parallel
panic = "abort"      # Use abort panics to avoid stack unwinding tables, speeding up builds and shrinking size
strip = true         # Strip debug symbols and symbols table to optimize final executable size

